[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edm-auditor-backend"
version = "0.1.0"
description = "Backend components for EDM-Auditor"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
