# Ground truth for the evaluation corpus.
#
# A quote is a fragment of the file text; line breaks and runs of spaces in it match any whitespace.
# Norm kinds describe the expected rule structure: value, frequency, day_of_month or text.
# A norm with checkable = false is not about documents, so no rule should be created for it.
# Every checkable norm of a document's acts that is not listed in its violations must be met.
# A violation without a quote is a missing condition.

[[acts]]
id = "payments"
file = "acts/payments.txt"
code = "EVAL-PAYMENTS"
title = "Положение об оплате труда работников"
norms = [
  { id = "pay-scope", quote = "Настоящее Положение определяет порядок и сроки выплаты", kind = "text", checkable = false },
  { id = "pay-control", quote = "Контроль за соблюдением настоящего Положения осуществляет главный бухгалтер", kind = "text", checkable = false },
  { id = "pay-frequency", quote = "Заработная плата выплачивается не реже двух раз в месяц", kind = "frequency" },
  { id = "pay-advance", quote = "Размер аванса должен составлять не менее 40 процентов", kind = "value" },
  { id = "pay-final", quote = "Окончательный расчет за месяц производится не позднее 5 числа следующего месяца", kind = "day_of_month" },
  { id = "pay-period", quote = "период, за который производится выплата", kind = "text" },
  { id = "pay-method", quote = "способ выплаты: наличными денежными средствами или перечислением на счет работника", kind = "text" },
  { id = "pay-in-kind", quote = "Не допускается выплата заработной платы в натуральной форме", kind = "text" },
]

