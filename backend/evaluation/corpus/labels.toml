  { id = "remote-interaction", quote = "порядок взаимодействия работника и нанимателя", kind = "text" },
  { id = "remote-internet", quote = "компенсация расходов работника на интернет не может быть меньше 50 рублей", kind = "value" },
  { id = "remote-notice", quote = "не позднее чем за 10 календарных дней до их изменения", kind = "value" },
  { id = "remote-notice-child", quote = "имеющего ребенка в возрасте до трех лет, наниматель уведомляет", kind = "value" },
]

