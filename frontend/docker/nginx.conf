server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Basic browser security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads up to the API limit (EDM_MAX_UPLOAD_BYTES, 20 MiB) plus the form overhead.
    client_max_body_size 25m;

    # Legal act upload and audit wait for the model, which can take minutes.
    proxy_connect_timeout 10s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    # Keep the external host:port so backend Origin CSRF checks match http://localhost:8080.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Set-Cookie;

    location /api/ {
        proxy_pass http://backend:8000;
    }

    # The health check and the API documentation (can be disabled via EDM_EXPOSE_DOCS=false).
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://backend:8000;
    }

    # Built files have hashed names and never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Every other path is a screen of the single page application.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
